<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Team</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <h1>Meet Our Team</h1>
    <p>This page is built from file.</p>
    <a href="/">Home</a> | <a href="/about">About</a> | <a href="/contact">Contact</a>

    {% for member in team_members %}
    <div class="team-member">
        <img src="{{ url_for('static', filename=member.image) }}" alt="{{ member.name }}">
        <h2>{{ member.name }}</h2>
        <p>{{ member.position }}</p>
        <p>{{ member.email }}</p>
    </div>
    {% endfor %}
    
</body>
</html>
